# 云枢配置示例。复制为 configs/config.yaml 后按需修改，也可以用 -config 指定路径。
# 所有配置项都可以不写，使用默认值；标注了环境变量的项也可以用 OPS_* 环境变量覆盖（环境变量优先）。
# 时长支持 s / m / h / d，例如 90s、30m、12h、180d。

app:
  # 系统名称，显示在登录页、侧边栏和浏览器标题中。        OPS_APP_NAME
  name: 云枢
  # 平台的访问地址，例如 https://ops.example.com。填写后告警消息里会带“在云枢中查看”链接。   OPS_EXTERNAL_URL
  external_url: ""

server:
  # 监听地址。                                          OPS_ADDR
  addr: ":8080"
  # 部署在 Nginx 等反向代理之后时，填写代理的 IP 或网段，审计日志才能记录真实客户端 IP。
  # 留空表示直接使用连接的来源地址。
  trusted_proxies: []
  # trusted_proxies: ["127.0.0.1", "10.0.0.0/8"]

data:
  # 数据目录：SQLite 数据库、自动生成的主密钥和 JWT 密钥都放在这里，请做好备份。   OPS_DATA_DIR
  dir: data
  # 数据库文件路径，默认 <dir>/ops.db。                    OPS_DB_PATH
  db_path: ""

security:
  # 加密云账号 AccessKey Secret 的主密钥（base64 编码的 32 字节）。         OPS_MASTER_KEY
  # 留空时首次启动自动生成到 <data.dir>/master.key。丢失后已保存的 Secret 无法解密，只能重新录入。
  master_key: ""
  # 登录令牌的签名密钥，留空时自动生成到 <data.dir>/jwt.key。             OPS_JWT_SECRET
  jwt_secret: ""
  # 登录有效期。                                        OPS_TOKEN_TTL
  token_ttl: 12h
  # 初始管理员 admin 的密码，只在首次创建 admin 时使用。     OPS_ADMIN_PASSWORD
  # 留空时随机生成并打印在启动日志里。
  admin_password: ""
  # 同一用户名连续输错密码的次数上限，以及达到上限后的锁定时长。
  login_max_failures: 5
  login_lock_duration: 5m

sync:
  # 定时同步间隔。                                      OPS_SYNC_INTERVAL
  interval: 30m
  # 服务启动后多久开始第一次同步。                        OPS_SYNC_START_DELAY
  start_delay: 10s
  # 同时采集的任务数（任务 = 账号 × 地域 × 资源类型）。     OPS_SYNC_CONCURRENCY
  concurrency: 8
  # 单个采集任务的超时时间，超时的任务记为失败，该地域保留上次同步的数据。
  task_timeout: 2m
  # 每个账号保留的同步记录条数。
  keep_jobs: 50

metrics:
  # 监控曲线的缓存时间，避免频繁调用云监控 API。
  cache_ttl: 60s

insight:
  # 24 小时 CPU 均值低于该值（%）的运行中主机记为“闲置”。
  idle_cpu_threshold: 5
  # 多少天内到期的包年包月资源计入“即将到期”。
  expiring_days: 30

audit:
  # 审计日志保留时长。                                   OPS_AUDIT_RETENTION
  retention: 180d

changes:
  # 资源变更记录（新增 / 变更 / 删除）的保留时长。
  retention: 90d

log:
  # 日志级别：debug / info / warn / error。             OPS_LOG_LEVEL
  level: info
  # 日志格式：text 或 json。                             OPS_LOG_FORMAT
  format: text

# 演示模式：不连接真实云厂商，使用生成的 6 个账号、784 项资源和监控曲线体验全部功能。   OPS_DEMO
demo: false
