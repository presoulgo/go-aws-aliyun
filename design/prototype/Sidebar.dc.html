<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧边导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 232px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border-right: 1px solid #E4E7EC; font-family: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', sans-serif; color: #151821;">
  <a href="Dashboard.dc.html" style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #EEF0F3; color: #151821; text-decoration: none;">
    <span style="width: 32px; height: 32px; border-radius: 9px; background: #2443B5; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path><path d="M12 12V2.5M12 12l8.2 4.75M12 12l-8.2 4.75"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 1.25;">
      <strong style="font-size: 16px;">云枢</strong>
      <span style="font-size: 11px; color: #6B7280;">多云运维聚合平台</span>
    </span>
  </a>
  <nav aria-label="主导航" style="padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;">
    <a href="Dashboard.dc.html" aria-current="{{n.dashboard.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.dashboard.bg}}; color: {{n.dashboard.fg}}; font-weight: {{n.dashboard.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
      概览
    </a>
    <a href="Resources.dc.html" aria-current="{{n.resources.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.resources.bg}}; color: {{n.resources.fg}}; font-weight: {{n.resources.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="7" rx="1.5"></rect><rect x="3.5" y="13" width="17" height="7" rx="1.5"></rect><path d="M7.5 7.5h.01M7.5 16.5h.01"></path></svg>
      资源中心
    </a>
    <a href="Monitor.dc.html" aria-current="{{n.monitor.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.monitor.bg}}; color: {{n.monitor.fg}}; font-weight: {{n.monitor.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>
      监控中心
    </a>
    <a href="Accounts.dc.html" aria-current="{{n.accounts.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.accounts.bg}}; color: {{n.accounts.fg}}; font-weight: {{n.accounts.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8.5-8.5M16 7l3 3"></path></svg>
      云账号
    </a>
    <div style="margin: 16px 12px 6px 12px; font-size: 12px; color: #6B7280;">系统管理</div>
    <a href="Users.dc.html" aria-current="{{n.users.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.users.bg}}; color: {{n.users.fg}}; font-weight: {{n.users.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"></path></svg>
      用户管理
    </a>
    <a href="Audit.dc.html" aria-current="{{n.audit.cur}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-radius: 8px; font-size: 14px; text-decoration: none; background: {{n.audit.bg}}; color: {{n.audit.fg}}; font-weight: {{n.audit.fw}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h8l4 4v13H7z"></path><path d="M15 3.5v4h4M10 12h6M10 16h6"></path></svg>
      审计日志
    </a>
  </nav>
  <div style="margin-top: auto; box-sizing: border-box; padding: 16px 20px; display: flex; justify-content: space-between; border-top: 1px solid #EEF0F3; font-size: 12px; color: #6B7280;">
    <span style="font-family: 'IBM Plex Mono', monospace;">v0.1.0</span>
    <span>只读接入</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","resources","monitor","accounts","users","audit"],"default":"dashboard"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'dashboard';
    var n = {};
    ['dashboard', 'resources', 'monitor', 'accounts', 'users', 'audit'].forEach(function (k) {
      var on = k === active;
      n[k] = {
        bg: on ? '#EDF1FD' : 'transparent',
        fg: on ? '#2443B5' : '#3F4654',
        fw: on ? '600' : '400',
        cur: on ? 'page' : 'false'
      };
    });
    return { n: n };
  }
}
</script>
</body>
</html>
